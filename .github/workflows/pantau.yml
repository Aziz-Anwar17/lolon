name: Pantau LOLON BUAH
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - name: Cek server
        env: { TG_TOKEN: '${{ secrets.TG_TOKEN }}', TG_CHAT: '${{ secrets.TG_CHAT }}' }
        run: |
          for i in 1 2 3; do
            if curl -sf --max-time 15 https://34-28-3-64.sslip.io/api/health | grep -q '"ok":true'; then echo "server sehat"; exit 0; fi
            sleep 20
          done
          curl -s "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" -d text="⚠️ LOLON BUAH tidak menjawab (https://34-28-3-64.sslip.io). Cek server Google Cloud proyek lolon-buah-e009."
          exit 1
